<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:1024px;overflow:hidden}
  .icon{width:1024px;height:1024px;position:relative;
    background:linear-gradient(160deg,#1e4066 0%,#16324f 58%,#122a42 100%);
    display:flex;align-items:center;justify-content:center}
  .frame-outer{position:absolute;inset:52px;border:10px solid rgba(233,214,160,.55);border-radius:36px}
  .frame-inner{position:absolute;inset:84px;border:4px solid rgba(233,214,160,.30);border-radius:26px}
  .zi{font-family:"Songti SC","SimSun",serif;font-weight:700;font-size:560px;color:#f4efe2;
      text-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1;transform:translateY(-14px)}
  .seal{position:absolute;right:128px;bottom:118px;width:168px;height:168px;border-radius:22px;
    background:linear-gradient(150deg,#c14a3c,#9c2f24);display:grid;grid-template-columns:1fr 1fr;
    place-items:center;padding:14px;box-shadow:0 8px 24px rgba(120,30,20,.45);transform:rotate(-4deg)}
  .seal span{font-family:"KaiTi","STKaiti",serif;font-weight:700;font-size:44px;color:#fdf6ea;line-height:1}
</style>
</head>
<body>
  <div class="icon">
    <div class="frame-outer"></div>
    <div class="frame-inner"></div>
    <div class="zi">族</div>
    <div class="seal"><span>传</span><span>家</span><span>之</span><span>谱</span></div>
  </div>
</body>
</html>
